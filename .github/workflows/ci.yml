name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build and test (${{ matrix.ros_distro }})
    # Jazzy and Rolling are left out: their released mujoco_ros2_control_plugins predate the
    # pre_step and on_reset hooks (0.1.2), so this package does not compile against them yet.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ros_distro: humble, os: ubuntu-22.04}
          - {ros_distro: kilted, os: ubuntu-24.04}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-pytest \
            ros-${{ matrix.ros_distro }}-mujoco-ros2-control-plugins \
            ros-${{ matrix.ros_distro }}-ament-cmake-gtest ros-${{ matrix.ros_distro }}-ament-cmake-pytest

      - name: Create workspace
        run: |
          mkdir -p ~/ros2_ws/src
          cp -r ${{ github.workspace }} ~/ros2_ws/src/mujoco_ros2_plugins

      - name: Build
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          cd ~/ros2_ws
          colcon build --packages-select mujoco_ros2_plugins

      - name: Test
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          cd ~/ros2_ws
          . install/setup.sh
          colcon test --packages-select mujoco_ros2_plugins --event-handlers console_direct+
          colcon test-result --verbose

  # Lyrical targets Ubuntu 26.04, so it runs in the ROS image on the 24.04 runner.
  build-and-test-lyrical:
    name: build and test (lyrical)
    runs-on: ubuntu-24.04
    container: ros:lyrical
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake python3-pytest python3-colcon-common-extensions \
            ros-lyrical-mujoco-ros2-control-plugins ros-lyrical-ament-cmake-gtest ros-lyrical-ament-cmake-pytest

      - name: Create workspace
        run: |
          mkdir -p ~/ros2_ws/src
          cp -r "$GITHUB_WORKSPACE" ~/ros2_ws/src/mujoco_ros2_plugins

      - name: Build
        shell: bash
        run: |
          . /opt/ros/lyrical/setup.bash
          cd ~/ros2_ws
          colcon build --packages-select mujoco_ros2_plugins

      - name: Test
        shell: bash
        run: |
          . /opt/ros/lyrical/setup.bash
          cd ~/ros2_ws
          . install/setup.bash
          colcon test --packages-select mujoco_ros2_plugins --event-handlers console_direct+
          colcon test-result --verbose
